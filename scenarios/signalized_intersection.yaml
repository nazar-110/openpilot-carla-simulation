schema_version: 1
scenario:
  id: signalized_intersection
  name: Red-light urban intersection
  kind: signalized_intersection
  description: >-
    The ego approaches a signalized intersection while its governing signal is
    held red. This is an exploratory boundary test because OpenPilot does not
    claim traffic-signal handling.
  map: Town10HD_Opt
  duration_s: 35
  route_length_m: 160
  target_speed_mps: 11.11
  parameters:
    warmup_active_s: 5
    signal_sight_distance_m: 45
    red_hold_s: 20
    terminate_on_collision: true
  thresholds:
    max_collisions: 0
    max_lane_invasions: 1
    max_abs_lateral_error_m: 1.25
    max_offroad_duration_s: 0.1
    min_route_completion: 0.99
    min_ttc_s: 0.5
    max_rms_jerk_mps3: 8.0
    max_p95_control_latency_ms: 100
    max_red_light_violations: 0
    max_stop_sign_violations: 0
    max_controller_disengagements: 0
    min_controller_active_fraction: 0.99
