schema_version: 1
scenario:
  id: lead_vehicle_braking
  name: Hard-braking lead vehicle
  kind: lead_vehicle_braking
  description: >-
    A lead vehicle travels at 40 km/h and receives a maximum-brake command once
    the ego reaches an approximately two-second time-to-collision boundary.
  map: Town10HD_Opt
  duration_s: 35
  route_length_m: 220
  target_speed_mps: 11.11
  parameters:
    warmup_active_s: 5
    lead_initial_gap_m: 30
    lead_speed_mps: 11.11
    lead_brake_command: maximum
    trigger_ttc_s: 2.0
    trigger_min_time_s: 2
    fallback_trigger_s: 7
    lead_stop_dwell_s: 5
    min_observed_lead_deceleration_mps2: 3.0
    terminate_on_collision: true
  thresholds:
    max_collisions: 0
    max_lane_invasions: 0
    max_abs_lateral_error_m: 1.0
    max_offroad_duration_s: 0.1
    min_route_completion: 0.99
    min_ttc_s: 0.5
    max_rms_jerk_mps3: 8.0
    max_p95_control_latency_ms: 100
    max_red_light_violations: 0
    max_stop_sign_violations: 0
    max_controller_disengagements: 0
    min_controller_active_fraction: 0.99
