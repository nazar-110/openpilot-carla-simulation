name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
      - run: python -m pytest
      - run: opencarla-eval validate --experiment experiments/urban_suite.yaml
      - run: opencarla-eval run --experiment experiments/smoke.yaml --backend synthetic
      - run: opencarla-eval analyze results/smoke --output reports/generated/smoke

